name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry config virtualenvs.create true
          poetry env use ${{ matrix.python }} || true
          poetry install --no-interaction --with test,dev
      - name: Run tests
        run: |
          poetry run python -m pytest -q
        shell: bash

  notify:
    needs: test
    if: ${{ always() && needs.test.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR when CI fails
        uses: actions/github-script@v6
        with:
          script: |
            const { context, github } = require('@actions/github');
            if (context.payload.pull_request) {
              const pr = context.payload.pull_request.number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body: `CI: Some tests failed. See checks for details.`
              });
            } else {
              console.log('CI failed on push, no PR to comment on.');
            }
